[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/ai/match"
  to = "/.netlify/functions/ai-match"
  status = 200

[[redirects]]
  from = "/api/ai/assistant"
  to = "/.netlify/functions/ai-assistant"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
